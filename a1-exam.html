:root{color-scheme:light dark;

:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}

.timer{font:600 18px Archivo,sans-serif;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:8px;white-space:nowrap}

.chip{font-size:14px;opacity:.92;white-space:nowrap}
.wrap{max-width:980px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,16px) 80px}
.muted{color:var(--mut)}.small{font-size:14px}

.btn.ghost{background:transparent;color:var(--brand)}.btn.warn{background:var(--acc);border-color:var(--acc)}

label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=number],select,textarea{width:100%;font:16px "Atkinson Hyperlegible",sans-serif;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:46px}
textarea{min-height:190px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,28px)}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 22px}

.ad{border:1px dashed var(--mut);border-radius:10px;padding:10px 12px;font-size:15px}

table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:700;color:var(--mut);font-size:13px}
td.n,th.n{text-align:right;white-space:nowrap}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--card)}
.badge{font-size:13px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.badge.done{border-color:var(--ok);color:var(--ok)}.badge.prog{border-color:var(--acc);color:var(--acc)}

.save{font-size:13px;opacity:.85;white-space:nowrap}
pre,.scroll{overflow-x:auto}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}.score{grid-template-columns:repeat(2,minmax(0,1fr))}.form-sheet .row{grid-template-columns:minmax(0,1fr);gap:4px}}

@media (prefers-reduced-motion:no-preference){.q{transition:border-color .2s}}

function score(ans){
 const c=k=>allItems(k).filter(i=>ans[i.id]===i.a).length;
 const s1=EXAM.s1.filter(f=>f.ok(norm(ans[f.id]))).length;
 return {hoeren:c('hoeren'),lesen:c('lesen'),s1};
}
const words=t=>(String(t||'').trim().match(/\S+/g)||[]).length;

/* ---------- Saving ---------- */
let saveTimer=null,saving=false,dirty=false;
function setSave(t){$('save').textContent=t}
function queueSave(){dirty=true;setSave('Saving…');clearTimeout(saveTimer);saveTimer=setTimeout(flush,1200)}
async function flush(){
 if(saving){saveTimer=setTimeout(flush,600);return}
 if(!dirty)return; dirty=false;
 const patch={answers:{...S.ans},plays:{...S.plays},updatedAt:Date.now()};
 Object.assign(S.att,patch);
 lsSet(S.att);setSave('Saved on this device');return;
 saving=true;
 try{await S.db.doc('attempts/'+S.uid).update(patch);setSave('All answers saved')}
 catch(e){setSave('Not saved — check connection');dirty=true;saveTimer=setTimeout(flush,4000)}
 saving=false;
}

/* ---------- Audio ---------- */
let speaking=null;
function deVoice(){const vs=speechSynthesis.getVoices();return vs.filter(v=>/^de/i.test(v.lang))}
async function playItem(it,btn,max){
 if(speaking)return;
 const used=S.plays[it.id]||0; if(used>=max)return;
 S.plays[it.id]=used+1; queueSave(); speaking=it.id; btn.classList.add('on'); btn.textContent='▶ Playing…';
 try{
  if(S.tts){await S.tts.speak(it.lines.map(([s,t])=>({text:t,voice:s==='M'?'rounded':'airy',language:'de'})))}
  else if('speechSynthesis' in window){
   const vs=deVoice();
   for(const [s,t] of it.lines){await new Promise(r=>{const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=.9;if(vs.length)u.voice=vs[s==='M'&&vs.length>1?1:0];u.pitch=s==='M'?.8:1.15;u.onend=u.onerror=r;speechSynthesis.speak(u)});await new Promise(r=>setTimeout(r,350))}
  }
 }catch(e){}
 speaking=null; setPlayBtn(btn,it.id,max);
}
function setPlayBtn(btn,id,max){const left=max-(S.plays[id]||0);btn.classList.remove('on');btn.disabled=left<=0;btn.textContent=left>0?`▶ Play audio (${left} left)`:'Audio used'}
const audioOK=()=>!!S.tts||('speechSynthesis' in window);

function optHTML(it,review){
 const keys=it.opts.length===2&&it.opts[0]==='Richtig'?['R','F']:['a','b','c'];
 return `<div class="opts ${keys[0]==='R'?'rf':''}">${it.opts.map((o,i)=>{
  const cls=review?(i===it.a?'right':(S.ans[it.id]===i?'wrong':'')):'';
  return `<label class="opt ${cls}"><input type="radio" name="${it.id}" value="${i}" ${S.ans[it.id]===i?'checked':''} ${review?'disabled':''}><span data-k="${keys[i]}">${esc(o)}</span></label>`}).join('')}</div>`;
}
function adsOpts(it,review){
 return `<div class="ads">${it.ads.map((a,i)=>`<div class="ad">${a}</div>`).join('')}</div>`+optHTML({...it,opts:['Anzeige a','Anzeige b']},review);
}
function qCard(it,n,extra='',review){
 return `<div class="q" id="q-${it.id}"><div class="qh"><span class="num">${n}</span><div class="qt">${esc(it.q)}</div>${extra}</div>${it.sign?`<div class="sign">${esc(it.sign)}</div>`:''}${it.ads?adsOpts(it,review):optHTML(it,review)}${review&&it.lines?`<div class="tr"><b>Transcript:</b> ${esc(it.lines.map(l=>l[1]).join(' / '))}</div>`:''}</div>`;
}
function secHoeren(review){
 let n=0;
 return (audioOK()||review?'':`<div class="note">Audio can't play on this device. Try the exam on a laptop browser, or ask your teacher.</div>`)+EXAM.hoeren.map(p=>`<div class="part"><h2>${p.title}<small>${p.sub}</small></h2></div>`+p.items.map(it=>{n++;return qCard(it,n,review?'':`<button type="button" class="play" data-play="${it.id}" data-max="${p.plays}"></button>`,review)}).join('')).join('');
}
function secLesen(review){
 let n=0;
 return EXAM.lesen.map(p=>`<div class="part"><h2>${p.title}<small>${p.sub}</small></h2></div>`+p.groups.map(g=>(g.text?`<div class="reading">${esc(g.text)}</div>`:'')+g.items.map(it=>{n++;return qCard(it,n,'',review)}).join('')).join('')).join('');
}
function secSchreiben(review){
 const t2=S.ans.s2||'';

 <div class="form-sheet"><h3>Sprachschule Deutsch Plus · Anmeldung</h3>
  <div class="row"><b>Name</b><span>Ana Costa</span></div>
  ${EXAM.s1.map((f,i)=>{const v=S.ans[f.id]||'';const ok=review?(f.ok(norm(v))?'✓':'✗ '+EXAM.s1ans[f.id]):'';
   return `<div class="row"><label for="${f.id}"><b>${i+1}. ${f.label}</b></label><div>${f.select?`<select id="${f.id}" data-txt ${review?'disabled':''}><option value="">— bitte wählen —</option>${f.select.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`:`<input type="text" id="${f.id}" data-txt value="${esc(v)}" maxlength="60" ${review?'disabled':''}>`}${review?`<div class="small" style="color:${ok==='✓'?'var(--ok)':'var(--bad)'}">${esc(ok)}</div>`:''}</div></div>`}).join('')}
 </div>

const SECS=[['hoeren','Hören','Listening'],['lesen','Lesen','Reading'],['schreiben','Schreiben','Writing']];
function counts(){
 return {hoeren:allItems('hoeren').filter(i=>S.ans[i.id]!==undefined).length+'/15',lesen:allItems('lesen').filter(i=>S.ans[i.id]!==undefined).length+'/15',
  schreiben:(EXAM.s1.filter(f=>(S.ans[f.id]||'').trim()).length+(words(S.ans.s2)>0?1:0))+'/6'};
}
function updTabs(){const c=counts();for(const [k] of SECS){const el=document.querySelector(`[data-sec="${k}"] small`);if(el)el.textContent=el.dataset.l+' · '+c[k]+' done'}}

 app.innerHTML=`<nav class="tabs" aria-label="Sections">${SECS.map(([k,de,en])=>`<button class="tab" data-sec="${k}" aria-current="${k===S.sec}">${de}<small data-l="${en}">${en} · ${c[k]} done</small></button>`).join('')}</nav>
 <div id="sec">${{hoeren:secHoeren,lesen:secLesen,schreiben:secSchreiben}[S.sec](false)}</div>

 app.querySelectorAll('[data-play]').forEach(b=>{const it=allItems('hoeren').find(x=>x.id===b.dataset.play);const max=+b.dataset.max;setPlayBtn(b,it.id,max);if(!audioOK())b.disabled=true;b.onclick=()=>playItem(it,b,max)});

 app.querySelectorAll('[data-txt]').forEach(t=>t.oninput=t.onchange=()=>{S.ans[t.id]=t.value;if(t.id==='s2')$('wc').textContent=words(t.value)+' words · aim for about 30';queueSave();updTabs()});
 const sb=$('submit'); if(sb)sb.onclick=async()=>{

let submitting=false;
async function sendSheet(){
 if(!SHEET_URL)return false;
 const a=S.att,sc=a.scores||score(S.ans);
 const body={name:a.name,cid:a.cid,startedAt:new Date(a.startedAt).toISOString(),submittedAt:new Date(a.submittedAt).toISOString(),autoSubmitted:!!a.autoSubmitted,
  hoeren:sc.hoeren,lesen:sc.lesen,schreiben1:sc.s1,autoTotal:sc.hoeren+sc.lesen+sc.s1,
  form:EXAM.s1.map(f=>f.label+': '+(S.ans[f.id]||'-')).join('; '),message:S.ans.s2||'',words:words(S.ans.s2),
  answers:allItems('hoeren').concat(allItems('lesen')).map(i=>i.id+'='+(S.ans[i.id]===undefined?'-':(i.ads?'ab':i.opts.length===2?'RF':'abc')[S.ans[i.id]])).join(' ')};
 try{await fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return true}catch(e){return false}
}
async function submit(auto){
 if(submitting)return; submitting=true; clearTimeout(saveTimer);
 const sc=score(S.ans);
 const patch={answers:{...S.ans},plays:{...S.plays},status:'submitted',submittedAt:Date.now(),updatedAt:Date.now(),scores:sc,autoSubmitted:!!auto};
 Object.assign(S.att,patch);
 lsSet(S.att); S.att.sent=await sendSheet(); lsSet(S.att); setSave('');
 S.view='result';render(); if(auto)toast('Time is up — your exam was submitted.');
}

}

async function copyText(txt){try{await navigator.clipboard.writeText(txt);toast('Copied')}catch(e){const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box"><p>Select all and copy:</p><textarea style="min-height:220px"></textarea><div class="toolbar" style="justify-content:flex-end"><button class="btn">Close</button></div></div>';m.querySelector('textarea').value=txt;m.querySelector('button').onclick=()=>m.remove();document.body.append(m);m.querySelector('textarea').select()}}

 $('gsave').onclick=async()=>{const v=$('g2').value;const n=v===''?null:Math.max(0,Math.min(10,+v));try{await S.db.doc('attempts/'+r.id).update({teacher:{s2:n,note:$('gn').value.trim(),at:Date.now()}});toast('Mark saved — the candidate sees it now')}catch(e){toast('Could not save the mark')}};
 $('gcopy').onclick=()=>{const keep={att:S.att,ans:S.ans};S.att=d;S.ans=ans;const t=summaryText();S.att=keep.att;S.ans=keep.ans;copyText(t)};
 $('greset').onclick=async()=>{if(await ask(`Delete ${d.name}'s attempt so they can start again? This can't be undone.`,'Delete','warn')){try{await S.db.doc('attempts/'+r.id).delete();S.sel=null;toast('Attempt deleted')}catch(e){toast('Could not delete')}}};
 if(scroll)el.scrollIntoView({behavior:'smooth',block:'start'});
}
$('teachBtn').onclick=()=>{if(S.view==='teacher'){S.view=S.att?(S.att.status==='submitted'?'result':'exam'):'login'}else{S.view='teacher'}render()};

/* ---------- Timer ---------- */
setInterval(()=>{
 if(S.view!=='exam'||!S.att)return;
 const left=Math.max(0,S.att.startedAt+MINUTES*60000-Date.now()),m=Math.floor(left/60000),s=Math.floor(left/1000)%60;
 const t=$('timer');t.textContent=`${m}:${String(s).padStart(2,'0')} left`;t.classList.toggle('low',left<5*60000);
 if(left<=0)submit(true);
},1000);

/* ---------- Boot ---------- */
function useAtt(d){S.att={...d};S.ans={...(d.answers||{})};S.plays={...(d.plays||{})};S.view=d.status==='submitted'?'result':'exam'}
S.code=ACCESS_CODE;S.canSave=false;S.canEdit=false;
if('speechSynthesis' in window)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
{const l=lsGet();if(l&&l.name)useAtt(l);else S.view='login';render()}

}
</script>
</body>
</html>
